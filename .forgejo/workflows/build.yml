name: Build and Publish
on: push

jobs:
  prepare:
    runs-on: docker
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      repo: ${{ steps.vars.outputs.repo }}
    steps:
      - name: Get vars
        id: vars
        run: |
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "repo=${{ github.repository }}" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    uses: chris/workflows/.forgejo/workflows/dotnet-build.yml@main
    with:
      repo_name: ${{ needs.prepare.outputs.repo }}
      commit_sha: ${{ needs.prepare.outputs.sha }}
      project_path: ./RetainerSales/RetainerSales.csproj
      dll_name: RetainerSales.dll
    secrets: inherit